[build]
target = "thumbv7m-none-eabi"

[target.thumbv7m-none-eabi]
rustflags = ["-C", "link-arg=-Tlink.x", "-C", "link-arg=-Tdefmt.x"]
# Provisional: WB32 has no probe-rs chip file yet; the STM32F103C8 core and
# flash base address match for RTT bring-up. Real flashing is done over
# wb32-dfu/OpenOCD (a hardware step performed separately).
runner = "probe-rs run --chip STM32F103C8"

[env]
DEFMT_LOG = "debug"
